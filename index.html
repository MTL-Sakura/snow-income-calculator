<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>雪儿的工资计算器</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">北京时间</p>
          <h1>雪儿的工资计算器</h1>
          <p id="currentTime" class="current-time">正在获取时间...</p>
        </div>
        <div class="month-box" aria-label="选择工资月份">
          <label for="monthPicker">工资月份</label>
          <input id="monthPicker" type="month">
        </div>
      </header>

      <section class="summary-band" aria-labelledby="totalTitle">
        <div>
          <p id="totalTitle" class="summary-label">本月工资</p>
          <strong id="totalSalary">¥0</strong>
        </div>
        <div class="summary-grid" aria-label="工资明细">
          <span>培训费 <b id="trainingTotal">¥0</b></span>
          <span>课时费 <b id="lessonTotal">¥0</b></span>
          <span>学生费 <b id="studentTotal">¥0</b></span>
        </div>
      </section>

      <div class="workspace-grid">
        <section class="tool-panel" aria-labelledby="incomeTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">收入录入</p>
              <h2 id="incomeTitle">基础工资</h2>
            </div>
            <span class="rate-pill">100 / 150 / 15</span>
          </div>

          <div class="field-grid">
            <label class="field-card" for="trainingDays">
              <span>培训天数</span>
              <input id="trainingDays" class="money-input" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              <small>每天 ¥100</small>
            </label>

            <label class="field-card" for="lessonCount">
              <span>上课节数</span>
              <input id="lessonCount" class="money-input" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              <small>每节 ¥150</small>
            </label>
          </div>
        </section>

        <section class="tool-panel" aria-labelledby="studentTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">四周统计</p>
              <h2 id="studentTitle">带学生人数</h2>
            </div>
            <span id="studentCountText" class="rate-pill">共 0 人</span>
          </div>

          <div id="weekFields" class="week-grid" aria-label="每周学生人数"></div>
        </section>

        <section class="calendar-panel" aria-labelledby="calendarTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">中国日历</p>
              <h2 id="calendarTitle">月份视图</h2>
            </div>
            <span id="monthLabel" class="rate-pill">--</span>
          </div>
          <div id="miniCalendar" class="mini-calendar" aria-label="月份日历"></div>
        </section>

        <section class="history-panel" aria-labelledby="historyTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">服务器保存</p>
              <h2 id="historyTitle">历史工资表</h2>
            </div>
          </div>

          <div class="auth-row">
            <label for="accessPassword">访问密码</label>
            <input id="accessPassword" type="password" autocomplete="current-password" placeholder="服务器密码">
            <label class="remember-row" for="rememberPassword">
              <input id="rememberPassword" type="checkbox">
              <span>记住</span>
            </label>
            <button id="connectHistory" type="button">连接</button>
          </div>

          <div class="action-row">
            <button id="saveRecord" class="primary-button" type="button">保存本月</button>
            <button id="resetForm" class="ghost-button" type="button">清空</button>
          </div>

          <p id="historyStatus" class="status-text" role="status">输入密码后可以读取和保存历史记录。</p>
          <div id="historyChart" class="history-chart" aria-live="polite"></div>
          <div id="historyList" class="history-list" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </body>
</html>
